server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/wasm
    image/svg+xml;

  # Never cache entrypoint / service worker / manifest so updates take effect immediately.
  location ~* ^/(index\.html|flutter_service_worker\.js|manifest\.json|version\.json|flutter_bootstrap\.js)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # Cache static compiled chunks, fonts, icons, and audio aggressively.
  location ~* \.(js|mjs|wasm|css|ttf|otf|svg|png|jpe?g|webp|ico|mp3|wav|ogg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA history routing fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
