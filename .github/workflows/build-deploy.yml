name: Build & Deploy Zetzy (Multi-Platform)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Target platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - web
          - windows
          - linux
      deploy_pages:
        description: "Deploy Web build to GitHub Pages (when target is all or web)"
        required: false
        default: true
        type: boolean
      publish_release:
        description: "Publish GitHub Release using version from pubspec.yaml (e.g. v1.0.0)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "zetzy-build-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Version Sync Check + Automated Verification (L10n, Analyze & Tests)
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Verify, Version Check & Test
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      should_release: ${{ steps.version.outputs.should_release }}
      run_android: ${{ steps.version.outputs.run_android }}
      run_web: ${{ steps.version.outputs.run_web }}
      run_deploy_pages: ${{ steps.version.outputs.run_deploy_pages }}
      run_windows: ${{ steps.version.outputs.run_windows }}
      run_linux: ${{ steps.version.outputs.run_linux }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve & Validate Version from pubspec.yaml
        id: version
        shell: bash
        run: |
          RAW_VERSION=$(awk -F': ' '/^version:/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' pubspec.yaml)
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Could not find 'version:' in pubspec.yaml"
            exit 1
          fi

          VERSION_NAME="${RAW_VERSION%%+*}"
          if [[ "$RAW_VERSION" == *"+"* ]]; then
            BUILD_NUMBER="${RAW_VERSION#*+}"
          else
            BUILD_NUMBER="1"
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            TAG_CORE="${TAG_NAME#v}"
            TAG_CORE="${TAG_CORE%%-*}"
            if [ "$TAG_CORE" != "$VERSION_NAME" ]; then
              echo "::error::Git tag '$TAG_NAME' does not match pubspec.yaml version '$VERSION_NAME' ($RAW_VERSION). Update pubspec.yaml first!"
              exit 1
            fi
            PRERELEASE=$([[ "$TAG_NAME" == *-* ]] && echo "true" || echo "false")
            SHOULD_RELEASE="true"
            TARGET="all"
            DEPLOY_PAGES="true"
          else
            TAG_NAME="v${VERSION_NAME}"
            PRERELEASE="false"
            SHOULD_RELEASE="${{ inputs.publish_release }}"
            TARGET="${{ inputs.target }}"
            DEPLOY_PAGES="${{ inputs.deploy_pages }}"
          fi

          RUN_ANDROID=$([[ "$TARGET" = "all" || "$TARGET" = "android" ]] && echo "true" || echo "false")
          RUN_WEB=$([[ "$TARGET" = "all" || "$TARGET" = "web" ]] && echo "true" || echo "false")
          RUN_DEPLOY_PAGES=$([[ "$RUN_WEB" = "true" && "$DEPLOY_PAGES" = "true" ]] && echo "true" || echo "false")
          RUN_WINDOWS=$([[ "$TARGET" = "all" || "$TARGET" = "windows" ]] && echo "true" || echo "false")
          RUN_LINUX=$([[ "$TARGET" = "all" || "$TARGET" = "linux" ]] && echo "true" || echo "false")

          echo "Resolved release version: pubspec=$RAW_VERSION tag=$TAG_NAME prerelease=$PRERELEASE release=$SHOULD_RELEASE"
          {
            echo "version_name=$VERSION_NAME"
            echo "build_number=$BUILD_NUMBER"
            echo "tag_name=$TAG_NAME"
            echo "prerelease=$PRERELEASE"
            echo "should_release=$SHOULD_RELEASE"
            echo "run_android=$RUN_ANDROID"
            echo "run_web=$RUN_WEB"
            echo "run_deploy_pages=$RUN_DEPLOY_PAGES"
            echo "run_windows=$RUN_WINDOWS"
            echo "run_linux=$RUN_LINUX"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies & generate localizations
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Run static analysis & tests
        run: |
          flutter analyze
          flutter test

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Android Release APK (Split per ABI: arm64-v8a, armeabi-v7a, x86_64)
  # ────────────────────────────────────────────────────────────────────────────
  build_android:
    name: Build Android (Split per ABI)
    needs: test
    if: ${{ needs.test.outputs.run_android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Android SDK & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo chown -R "$USER:$USER" "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build Split-per-ABI Release APKs
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Stage APK artifacts with clean names
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/android/zetzy-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/android/zetzy-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/android/zetzy-android-x86_64.apk

      - name: Upload Android Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: zetzy-android-split-apks
          path: dist/android/*.apk
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Web Release Build + GitHub Pages Deployment
  # ────────────────────────────────────────────────────────────────────────────
  build_web:
    name: Build Web (SPA + Deferred Chunks)
    needs: test
    if: ${{ needs.test.outputs.run_web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Flutter Web Release
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetzy-web-release
          path: build/web

      - name: Upload GitHub Pages Artifact
        if: ${{ needs.test.outputs.run_deploy_pages == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy_pages:
    name: Deploy to GitHub Pages
    needs: [test, build_web]
    if: ${{ needs.test.outputs.run_deploy_pages == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Windows Desktop Release Build (x64)
  # ────────────────────────────────────────────────────────────────────────────
  build_windows:
    name: Build Windows (x64)
    needs: test
    if: ${{ needs.test.outputs.run_windows == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Windows Release
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter gen-l10n
          flutter build windows --release `
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" `
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Package Windows Release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/windows/zetzy-windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetzy-windows-x64
          path: dist/windows/zetzy-windows-x64.zip
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # 5. Linux Desktop Release Build (x64)
  # ────────────────────────────────────────────────────────────────────────────
  build_linux:
    name: Build Linux (x64)
    needs: test
    if: ${{ needs.test.outputs.run_linux == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Linux Release
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter gen-l10n
          flutter build linux --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Package Linux Release Tarball
        run: |
          mkdir -p dist/linux
          tar -czvf dist/linux/zetzy-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetzy-linux-x64
          path: dist/linux/zetzy-linux-x64.tar.gz
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # 6. GitHub Release Publisher (Synced with pubspec.yaml version)
  # ────────────────────────────────────────────────────────────────────────────
  publish_release:
    name: Publish GitHub Release
    needs: [test, build_android, build_windows, build_linux]
    if: ${{ always() && needs.test.outputs.should_release == 'true' && (needs.build_android.result == 'success' || needs.build_windows.result == 'success' || needs.build_linux.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: find release-assets -type f | sort

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.test.outputs.tag_name }}
          name: "Zetzy ${{ needs.test.outputs.tag_name }} (Build ${{ needs.test.outputs.build_number }})"
          prerelease: ${{ needs.test.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release-assets/*
