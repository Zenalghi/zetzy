name: Build & Deploy Zetzy (Manual Multi-Platform)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - web
          - windows
          - linux
      deploy_pages:
        description: "Deploy Web build to GitHub Pages (when target is all or web)"
        required: false
        default: true
        type: boolean
      release_tag:
        description: "Optional Git tag for GitHub Release (e.g. v1.0.0) — leave empty to only produce artifacts"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "zetzy-manual-build-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Automated Verification (L10n + Unit & Widget Tests)
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies & generate localizations
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Run unit & widget tests
        run: flutter test

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Android Release APK (Split per ABI: arm64-v8a, armeabi-v7a, x86_64)
  # ────────────────────────────────────────────────────────────────────────────
  build_android:
    name: Build Android (Split per ABI)
    needs: test
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Android SDK & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo chown -R "$USER:$USER" "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build Split-per-ABI Release APKs
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Stage APK artifacts with clean names
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/android/zetzy-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/android/zetzy-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/android/zetzy-android-x86_64.apk

      - name: Upload Android Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: zetzy-android-split-apks
          path: dist/android/*.apk
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Web Release Build + GitHub Pages Deployment
  # ────────────────────────────────────────────────────────────────────────────
  build_web:
    name: Build Web (SPA + Deferred Chunks)
    needs: test
    if: ${{ inputs.target == 'all' || inputs.target == 'web' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Flutter Web Release
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetzy-web-release
          path: build/web

      - name: Upload GitHub Pages Artifact
        if: ${{ inputs.deploy_pages }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy_pages:
    name: Deploy to GitHub Pages
    needs: build_web
    if: ${{ (inputs.target == 'all' || inputs.target == 'web') && inputs.deploy_pages }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Windows Desktop Release Build (x64)
  # ────────────────────────────────────────────────────────────────────────────
  build_windows:
    name: Build Windows (x64)
    needs: test
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Windows Release
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter gen-l10n
          flutter build windows --release `
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" `
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Package Windows Release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/windows/zetzy-windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetzy-windows-x64
          path: dist/windows/zetzy-windows-x64.zip
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # 5. Linux Desktop Release Build (x64)
  # ────────────────────────────────────────────────────────────────────────────
  build_linux:
    name: Build Linux (x64)
    needs: test
    if: ${{ inputs.target == 'all' || inputs.target == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Linux Release
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter gen-l10n
          flutter build linux --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Package Linux Release Tarball
        run: |
          mkdir -p dist/linux
          tar -czvf dist/linux/zetzy-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetzy-linux-x64
          path: dist/linux/zetzy-linux-x64.tar.gz
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # 6. Optional GitHub Release Publisher (when release_tag is provided)
  # ────────────────────────────────────────────────────────────────────────────
  publish_release:
    name: Publish GitHub Release
    needs: [build_android, build_windows, build_linux]
    if: ${{ always() && inputs.release_tag != '' && (needs.build_android.result == 'success' || needs.build_windows.result == 'success' || needs.build_linux.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Zetzy ${{ inputs.release_tag }}"
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.zip
            release-assets/*.tar.gz
